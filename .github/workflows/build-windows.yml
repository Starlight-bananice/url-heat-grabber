name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布到哪个 Release 标签；留空则只上传 Actions 构建产物'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install Pillow

      - name: Test parsers, task model and Excel export on Windows
        run: python -m unittest discover -s tests -v

      - name: Test Windows desktop flows
        run: python tests/desktop_integration.py

      - name: Build executable
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean UrlHeat-windows.spec

      - name: Verify Windows version resource
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\链接热度抓取.exe'
          $version = (Get-Item -LiteralPath $exe).VersionInfo
          if ($version.ProductVersion -ne '0.6.2' -or $version.FilePrivatePart -ne 6) {
            throw "应用版本资源不匹配：$($version.ProductVersion)"
          }
          $version | Format-List ProductName, ProductVersion, FileVersion

      - name: Test packaged UI, bundled browser driver, local page and Excel export
        run: python tests/windows_bundle.py 'dist/链接热度抓取.exe' 'qa/windows-bundle'

      - name: Upload Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: qa/windows-bundle/
          if-no-files-found: ignore

      - name: Package executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\链接热度抓取.exe'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'dist\URLHeat-0.6.2-windows-x64.zip'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "未找到构建结果：$exe"
          }
          Compress-Archive -LiteralPath $exe -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $([System.IO.Path]::GetFileName($zip))" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: url-valid-windows-x64
          path: dist/URLHeat-0.6.2-windows-x64.zip*
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: ${{ inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.release_tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:GITHUB_REF_NAME
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw '未指定 Release 标签。'
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            throw '请先创建目标 Release，再补传 Windows 安装包。'
          }
          gh release upload $tag 'dist/URLHeat-0.6.2-windows-x64.zip' 'dist/URLHeat-0.6.2-windows-x64.zip.sha256' --repo $env:GITHUB_REPOSITORY
